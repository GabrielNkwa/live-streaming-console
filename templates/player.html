<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DLC Streaming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Plyr CSS for modern video player styling -->
    <link rel="stylesheet" href="/assets/plyr.css" />
    <style>
        :root {
            --primary: #d32f2f;
        }
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 15%, #1c1c1f 0%, #0b0b0d 55%, #050506 100%);
            min-height: 100dvh;
            margin: 0;
            font-family: 'Segoe UI Variable', 'Segoe UI', ui-sans-serif, system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .panel {
            position: relative;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            box-shadow:
                0 20px 60px -20px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.1);
            padding: 28px;
            max-width: 760px;
            width: 100%;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--primary);
            animation: pulse 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: .5; }
            50% { opacity: 1; }
        }
        .brand-label {
            color: rgba(255,255,255,0.55);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        h1 {
            color: #fff;
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #fca5a5;
            background: rgba(211,47,47,0.15);
            border: 1px solid rgba(211,47,47,0.3);
            padding: 4px 10px;
            border-radius: 999px;
        }
        .live-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: #f87171;
            animation: pulse 1.6s ease-in-out infinite;
        }
        .plyr {
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="panel-header">
            <div class="brand">
                <span class="brand-dot"></span>
                <span class="brand-label">DLC Surveillance</span>
            </div>
            <span class="live-badge"><span class="dot"></span>LIVE</span>
        </div>
        <h1 style="margin-bottom: 16px;">Live Streaming</h1>
        <!-- Video.js for FLV streaming support -->
        <video id="player" class="plyr" controls width="100%" height="400"></video>
    </div>
    <!-- flv.js for FLV streaming -->
    <script src="/assets/flv.min.js"></script>
    <!-- Plyr JS for beautiful controls -->
    <script src="/assets/plyr.polyfilled.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const videoElement = document.getElementById('player');
            if (flvjs.isSupported()) {
                const flvPlayer = flvjs.createPlayer({
                    type: 'flv',
                    url: 'static/result.flv'
                });
                flvPlayer.attachMediaElement(videoElement);
                flvPlayer.load();
            }
            const plyrPlayer = new Plyr(videoElement, {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'
                ],
                seekTime: 10,
                autoplay: false,
                ratio: '16:9'
            });
        });
    </script>
</body>
</html>
